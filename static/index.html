<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f7fc">
  <title>Nota · Trascrizione lezioni</title>
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <header class="top"><div class="shell brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span> nota.</div></header>
  <main class="shell">
    <div class="hero">
      <h1>Lezioni in <em>parole.</em></h1>
      <p>Trasforma le registrazioni delle lezioni in un unico documento, pronto da studiare.</p>
    </div>
    <div class="workspace">
      <section class="card" aria-labelledby="audio-title">
        <h2 id="audio-title">Registrazioni</h2>
        <p class="hint">Trascina gli audio qui sotto, poi mettili in ordine.</p>
        <label class="drop" id="drop">
          <input id="files" type="file" accept=".mp3,.wav,.m4a,.aac,.ogg,.opus,.flac,.webm,.mp4" multiple>
          <span class="upload-icon" aria-hidden="true">＋</span>
          <strong>Aggiungi registrazioni</strong>
          <small>MP3, WAV, M4A e altri formati · max 250 MB per file</small>
        </label>
        <ol id="queue" class="queue" aria-label="Ordine delle registrazioni"></ol>
      </section>
      <section class="card output" aria-labelledby="export-title">
        <h2 id="export-title">Documento finale</h2>
        <fieldset>
          <legend>Scegli il formato</legend>
          <label class="choice"><input type="radio" name="format" value="pdf" form="workflow" required><span class="format-icon" aria-hidden="true">PDF</span><span><b>PDF</b><small>Da leggere e stampare</small></span></label>
          <label class="choice"><input type="radio" name="format" value="docx" form="workflow" required><span class="format-icon" aria-hidden="true">DOC</span><span><b>Word</b><small>Modificabile · .docx</small></span></label>
        </fieldset>
        <form id="workflow">
          <button type="submit" id="start" disabled>Trascrivi e scarica</button>
        </form>
        <button type="button" class="secondary" id="download" hidden>Scarica di nuovo</button>
        <div id="progress" hidden>
          <progress id="bar" value="0" max="1" aria-label="Audio completati"></progress>
        </div>
        <p id="status" role="status" aria-live="polite"></p>
        <p id="error" role="alert"></p>
      </section>
    </div>
    <footer>Elaborazione locale con Whisper · Italiano</footer>
  </main>
</body>
</html>
